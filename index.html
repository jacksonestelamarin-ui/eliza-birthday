<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para Eliza 💙</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
}

body {
  background:
    radial-gradient(circle at 50% 42%, #253653 0%, #101b2d 42%, #050912 100%);
  font-family: Georgia, "Times New Roman", serif;
  position: relative;
}

/* Luz cálida del ramo */
.ambient-light {
  position: absolute;
  width: 85vw;
  height: 85vw;
  max-width: 800px;
  max-height: 800px;
  left: 50%;
  top: 53%;
  transform: translate(-50%, -50%);
  background: radial-gradient(
    circle,
    rgba(255, 211, 89, .18),
    rgba(255, 181, 70, .07) 35%,
    transparent 70%
  );
  filter: blur(30px);
  opacity: 0;
  animation: lightIn 3s ease 3.5s forwards;
}

@keyframes lightIn {
  to { opacity: 1; }
}

/* =========================
   RAMO
========================= */

.bouquet {
  position: absolute;
  width: 100%;
  height: 100%;
  left: 0;
  bottom: 0;
}

/* =========================
   TALLOS
========================= */

.stem {
  position: absolute;
  bottom: -5%;
  width: 5px;
  height: var(--height);
  transform-origin: bottom center;
  transform: scaleY(0);
  border-radius: 100%;
  background: linear-gradient(
    90deg,
    #173b28,
    #47784b,
    #244c31
  );
  animation: stemGrow 3.2s cubic-bezier(.2,.75,.2,1) forwards;
  animation-delay: var(--delay);
}

@keyframes stemGrow {
  to {
    transform: scaleY(1);
  }
}

/* =========================
   HOJAS
========================= */

.leaf {
  position: absolute;
  width: 45px;
  height: 20px;
  background: linear-gradient(
    135deg,
    #234d31,
    #67955b
  );
  border-radius: 100% 0 100% 0;
  transform-origin: 0 50%;
  opacity: 0;
  animation: leafGrow 1s cubic-bezier(.2,.8,.2,1) forwards;
  animation-delay: var(--delay);
}

@keyframes leafGrow {
  0% {
    opacity: 0;
    transform: scale(0) rotate(var(--rotation));
  }

  100% {
    opacity: 1;
    transform: scale(1) rotate(var(--rotation));
  }
}

/* =========================
   GIRASOL
========================= */

.sunflower {
  position: absolute;
  width: 125px;
  height: 125px;
  transform: translate(-50%, 20px) scale(.05);
  opacity: 0;
  animation: sunflowerOpen 1.8s cubic-bezier(.15,.9,.3,1.25) forwards;
  animation-delay: var(--delay);
}

@keyframes sunflowerOpen {
  0% {
    opacity: 0;
    transform: translate(-50%, 25px) scale(.05) rotate(-18deg);
  }

  60% {
    opacity: 1;
    transform: translate(-50%, -5px) scale(1.08) rotate(4deg);
  }

  100% {
    opacity: 1;
    transform: translate(-50%, 0) scale(1) rotate(0);
  }
}

.sunflower .petal {
  position: absolute;
  width: 33px;
  height: 62px;
  left: 50%;
  top: 50%;
  transform-origin: 50% 94%;
  border-radius: 52% 48% 48% 48%;
  background: linear-gradient(
    160deg,
    #fff09a 0%,
    #ffd447 35%,
    #e4a31b 100%
  );
  box-shadow:
    inset -5px -7px 10px rgba(130,75,0,.14);
}

.sunflower .petal:nth-child(1) { transform: translate(-50%,-94%) rotate(0deg); }
.sunflower .petal:nth-child(2) { transform: translate(-50%,-94%) rotate(30deg); }
.sunflower .petal:nth-child(3) { transform: translate(-50%,-94%) rotate(60deg); }
.sunflower .petal:nth-child(4) { transform: translate(-50%,-94%) rotate(90deg); }
.sunflower .petal:nth-child(5) { transform: translate(-50%,-94%) rotate(120deg); }
.sunflower .petal:nth-child(6) { transform: translate(-50%,-94%) rotate(150deg); }
.sunflower .petal:nth-child(7) { transform: translate(-50%,-94%) rotate(180deg); }
.sunflower .petal:nth-child(8) { transform: translate(-50%,-94%) rotate(210deg); }
.sunflower .petal:nth-child(9) { transform: translate(-50%,-94%) rotate(240deg); }
.sunflower .petal:nth-child(10) { transform: translate(-50%,-94%) rotate(270deg); }
.sunflower .petal:nth-child(11) { transform: translate(-50%,-94%) rotate(300deg); }
.sunflower .petal:nth-child(12) { transform: translate(-50%,-94%) rotate(330deg); }

.sunflower .center {
  position: absolute;
  width: 48px;
  height: 48px;
  left: 50%;
  top: 50%;
  transform: translate(-50%,-50%);
  border-radius: 50%;
  background:
    radial-gradient(circle at 35% 30%, #70451e, #24150b 75%);
  box-shadow:
    inset 0 0 12px rgba(0,0,0,.7),
    0 0 12px rgba(255,193,53,.25);
}

/* pequeños detalles del centro */
.sunflower .center::before {
  content: "";
  position: absolute;
  inset: 8px;
  border-radius: 50%;
  background:
    radial-gradient(circle, #a66a25 1px, transparent 2px);
  background-size: 7px 7px;
}

/* =========================
   FLORES AZULES
========================= */

.blue-flower {
  position: absolute;
  width: 78px;
  height: 78px;
  opacity: 0;
  transform: translate(-50%, 20px) scale(.1);
  animation: blueOpen 1.4s cubic-bezier(.15,.9,.3,1.25) forwards;
  animation-delay: var(--delay);
}

@keyframes blueOpen {
  0% {
    opacity: 0;
    transform: translate(-50%, 20px) scale(.1) rotate(-20deg);
  }

  70% {
    opacity: 1;
    transform: translate(-50%, -4px) scale(1.08) rotate(5deg);
  }

  100% {
    opacity: 1;
    transform: translate(-50%, 0) scale(1) rotate(0);
  }
}

.blue-flower .petal {
  position: absolute;
  width: 27px;
  height: 42px;
  left: 50%;
  top: 50%;
  transform-origin: 50% 92%;
  border-radius: 50%;
  background: linear-gradient(
    150deg,
    #b8ddff,
    #6da9e5 45%,
    #3974b7
  );
  box-shadow: inset -4px -5px 8px rgba(0,0,0,.12);
}

.blue-flower .petal:nth-child(1) { transform: translate(-50%,-92%) rotate(0deg); }
.blue-flower .petal:nth-child(2) { transform: translate(-50%,-92%) rotate(60deg); }
.blue-flower .petal:nth-child(3) { transform: translate(-50%,-92%) rotate(120deg); }
.blue-flower .petal:nth-child(4) { transform: translate(-50%,-92%) rotate(180deg); }
.blue-flower .petal:nth-child(5) { transform: translate(-50%,-92%) rotate(240deg); }
.blue-flower .petal:nth-child(6) { transform: translate(-50%,-92%) rotate(300deg); }

.blue-flower .center {
  position: absolute;
  width: 18px;
  height: 18px;
  left: 50%;
  top: 50%;
  transform: translate(-50%,-50%);
  border-radius: 50%;
  background: #f5c94d;
  box-shadow: 0 0 10px rgba(255,210,80,.35);
}

/* =========================
   FLORES AMARILLAS PEQUEÑAS
========================= */

.yellow-flower {
  position: absolute;
  width: 54px;
  height: 54px;
  opacity: 0;
  transform: translate(-50%, 15px) scale(0);
  animation: littleOpen 1.2s ease forwards;
  animation-delay: var(--delay);
}

@keyframes littleOpen {
  to {
    opacity: 1;
    transform: translate(-50%, 0) scale(1);
  }
}

.yellow-flower .petal {
  position: absolute;
  width: 19px;
  height: 30px;
  left: 50%;
  top: 50%;
  transform-origin: 50% 92%;
  border-radius: 50%;
  background: linear-gradient(
    150deg,
    #fff2a7,
    #efb52e
  );
}

.yellow-flower .petal:nth-child(1) { transform: translate(-50%,-92%) rotate(0deg); }
.yellow-flower .petal:nth-child(2) { transform: translate(-50%,-92%) rotate(72deg); }
.yellow-flower .petal:nth-child(3) { transform: translate(-50%,-92%) rotate(144deg); }
.yellow-flower .petal:nth-child(4) { transform: translate(-50%,-92%) rotate(216deg); }
.yellow-flower .petal:nth-child(5) { transform: translate(-50%,-92%) rotate(288deg); }

.yellow-flower .center {
  position: absolute;
  width: 12px;
  height: 12px;
  left: 50%;
  top: 50%;
  transform: translate(-50%,-50%);
  background: #7d531b;
  border-radius: 50%;
}

/* =========================
   FLORES BLANCAS DE RELLENO
========================= */

.white-flower {
  position: absolute;
  width: 38px;
  height: 38px;
  opacity: 0;
  animation: littleOpen 1s ease forwards;
  animation-delay: var(--delay);
}

.white-flower .petal {
  position: absolute;
  width: 14px;
  height: 23px;
  left: 50%;
  top: 50%;
  transform-origin: 50% 92%;
  border-radius: 50%;
  background: #fff9e8;
}

.white-flower .petal:nth-child(1) { transform: translate(-50%,-92%) rotate(0deg); }
.white-flower .petal:nth-child(2) { transform: translate(-50%,-92%) rotate(72deg); }
.white-flower .petal:nth-child(3) { transform: translate(-50%,-92%) rotate(144deg); }
.white-flower .petal:nth-child(4) { transform: translate(-50%,-92%) rotate(216deg); }
.white-flower .petal:nth-child(5) { transform: translate(-50%,-92%) rotate(288deg); }

.white-flower .center {
  position: absolute;
  width: 8px;
  height: 8px;
  left: 50%;
  top: 50%;
  transform: translate(-50%,-50%);
  background: #f1c94d;
  border-radius: 50%;
}

/* =========================
   MOVIMIENTO FINAL
========================= */

.flower-group {
  animation: gentleBreeze 5s ease-in-out infinite;
  animation-delay: 10s;
  transform-origin: bottom center;
}

@keyframes gentleBreeze {
  0%,100% {
    transform: rotate(0deg);
  }

  50% {
    transform: rotate(.7deg);
  }
}

/* =========================
   MENSAJE
========================= */

.message {
  position: absolute;
  z-index: 20;
  left: 50%;
  top: 7%;
  width: 92%;
  text-align: center;
  color: white;
  opacity: 0;
  transform: translate(-50%, 20px);
  animation: messageIn 2.2s ease 10s forwards;
  text-shadow:
    0 2px 12px rgba(0,0,0,.8),
    0 0 25px rgba(255,210,100,.12);
}

.message h1 {
  font-size: clamp(28px, 7vw, 52px);
  line-height: 1.12;
  font-weight: normal;
  margin-bottom: 12px;
}

.message p {
  font-size: clamp(19px, 4.5vw, 28px);
  color: #dcecff;
}

@keyframes messageIn {
  to {
    opacity: 1;
    transform: translate(-50%, 0);
  }
}

/* =========================
   BRILLOS
========================= */

.sparkle {
  position: absolute;
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: #fff3ad;
  opacity: 0;
  animation: sparkle 2.7s ease-in-out infinite;
  animation-delay: var(--delay);
}

@keyframes sparkle {
  0%,100% {
    opacity: 0;
    transform: scale(.3);
  }

  50% {
    opacity: .9;
    transform: scale(1.5);
  }
}

/* =========================
   CELULAR
========================= */

@media(max-width:600px) {

  .sunflower {
    width: 92px;
    height: 92px;
  }

  .sunflower .petal {
    width: 25px;
    height: 47px;
  }

  .sunflower .center {
    width: 36px;
    height: 36px;
  }

  .blue-flower {
    width: 61px;
    height: 61px;
  }

  .blue-flower .petal {
    width: 21px;
    height: 34px;
  }

  .leaf {
    width: 36px;
    height: 16px;
  }
}
</style>
</head>
